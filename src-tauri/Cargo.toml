[package]
name = "square"
version = "0.1.0"
description = "Conversor local de archivos"
edition = "2021"
license = "GPL-3.0-or-later"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
image = "0.25"
pdf-extract = "0.10"
tempfile = "3"
resvg = "0.45"
[profile.release]
lto = true
codegen-units = 1
strip = true
