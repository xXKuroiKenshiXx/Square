name: Build Square
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: square-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg pandoc
      - name: Windows engines
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg pandoc -y --no-progress
          ./scripts/prepare-engines.ps1
      - name: Linux engines
        if: runner.os == 'Linux'
        run: bash scripts/prepare-engines.sh
      - run: npm ci
      - name: Record embedded engine provenance
        run: node scripts/engine-manifest.mjs
      - name: Verify frontend
        run: npm run build
      - name: Verify backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin square
      - name: Windows packages
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis
      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Square-Windows
          path: |
            src-tauri/target/release/square.exe
            src-tauri/target/release/bundle/nsis/*.exe
            release/engine-manifest-*.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: Square-Linux-AppImage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            release/engine-manifest-*.json
  interface:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview and test interface
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/square-vite.log 2>&1 &
          for attempt in $(seq 1 30); do curl --silent --fail http://127.0.0.1:1420/ > /dev/null && break; sleep 1; done
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Square-UI-captures
          path: release/ui-*.png
