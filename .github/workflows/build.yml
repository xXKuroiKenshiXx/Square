name: Build Square
on: [push, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg pandoc
      - name: Windows engines
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg pandoc -y --no-progress
          ./scripts/prepare-engines.ps1
      - name: Linux engines
        if: runner.os == 'Linux'
        run: bash scripts/prepare-engines.sh
      - run: npm ci
      - name: Verify frontend
        run: npm run build
      - name: Verify backend
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Windows packages
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis
      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Square-Windows
          path: |
            src-tauri/target/release/square.exe
            src-tauri/target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: Square-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
