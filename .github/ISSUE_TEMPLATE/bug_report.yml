name: Reportar un error
description: Algo no funciona como esperabas.
title: "[Error] "
body:
  - type: input
    id: version
    attributes:
      label: Versión de Square
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Sistema
      options: [Windows 10, Windows 11, Linux X11, Linux Wayland, Otro]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos y resultado
      description: Incluí formato de origen y destino. No adjuntes archivos personales ni rutas privadas.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Revisé que la muestra y las capturas no contienen información privada.
          required: true
